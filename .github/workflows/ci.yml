name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (100-column standard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verible
        # Verible's release asset filenames embed the version tag (e.g.
        # verible-v0.0-4145-g7bd8603b-linux-static-x86_64.tar.gz), so there's
        # no stable /latest/download/<name> URL to hardcode -- resolve the
        # actual asset URL from the API instead.
        run: |
          url=$(curl -fsSL https://api.github.com/repos/chipsalliance/verible/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*linux-static-x86_64[^"]*"' \
            | head -1 | sed -E 's/.*"(https[^"]+)"/\1/')
          curl -fsSL -o verible.tar.gz "$url"
          mkdir -p verible && tar xzf verible.tar.gz -C verible --strip-components=1
          echo "$PWD/verible/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        # Runs directly against the shipped files, not a patched scratch copy
        # (unlike the line-length lint step below) -- verible-verilog-format
        # --verify leaves an unparseable file untouched and exits 0 rather
        # than erroring, confirmed directly, so the exercises whose bug is a
        # parse error don't need patching first just to check formatting.
        run: make format-check
      - name: Install patch
        run: sudo apt-get update && sudo apt-get install -y patch
      - name: Apply patches into a scratch copy
        # Lint the *patched* (syntactically complete) files, not the shipped
        # ones: several exercises' bug is a deliberate parse error, which a
        # linter's parser can't get past to even check line length. The
        # patched form is what's actually being style-checked here.
        run: |
          mkdir -p /tmp/lint-scratch
          cp -r learn exercises /tmp/lint-scratch/
          python3 scripts/patch_all.py --target-dir /tmp/lint-scratch
      - name: Lint patched learn/ and exercises/
        # --ruleset=none: verible's default ruleset enables many style rules
        # (module name must match filename, constraint naming conventions,
        # forbidding void-cast randomize(), etc.) that conflict with this
        # repo's deliberate conventions (every exercise uses `module top;`
        # so the Makefile can invoke any of them uniformly). Only line-length
        # is an actual house rule here.
        # find, not a glob: exercises/ nests domain subdirectories
        # (exercises/sv/, exercises/uvm/, exercises/csr/), so a flat *.sv
        # glob would silently lint nothing once files aren't directly in
        # exercises/ itself.
        run: |
          find /tmp/lint-scratch/learn /tmp/lint-scratch/exercises -name '*.sv' \
            -exec verible-verilog-lint --ruleset=none --rules=+line-length {} +

  manifest-sync:
    name: manifest.toml matches disk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_manifest_sync.py

  unpatched-must-fail:
    name: Every exercise fails as shipped
    runs-on: ubuntu-latest
    # Pinned, not `latest`: apt's Verilator (Ubuntu 24.04 ships 5.020) turned
    # out to be missing several constrained-random features most exercises
    # depend on (randomize() with {}, local::, rand on dynamic arrays,
    # multi-index foreach on unpacked arrays) and has real constraint-solver
    # behavior differences from the version this repo was actually built and
    # verified against -- caused a real CI failure the first time this ran.
    # Bump deliberately, re-verify locally first, same discipline as
    # verilator_broken_as_of in manifest.toml. Hardcoded here rather than an
    # env var: GitHub Actions doesn't resolve the env context inside
    # `container:`, it's needed before job-level env is established.
    container: "verilator/verilator:v5.050"
    steps:
      - uses: actions/checkout@v4
      - name: Install z3
        # The verilator/verilator image doesn't bundle an SMT solver.
        # Without one, `randomize()` on anything past Verilator's own
        # lightweight constraint solver silently falls back and behaves
        # differently than the locally-verified (z3-equipped) runs -- caused
        # a real CI failure where a *different* pair of exercises than usual
        # spuriously "passed" unpatched, because the fallback solver finds
        # different satisfying assignments than z3 does for the same broken
        # constraints, not because those exercises' checkers changed.
        run: apt-get update && apt-get install -y z3
      - run: python3 scripts/check_unpatched_fails.py

  patches-solve:
    name: Every patch applies safely and passes its checker
    needs: [manifest-sync]
    runs-on: ubuntu-latest
    # Same pin as unpatched-must-fail -- see the comment there.
    container: "verilator/verilator:v5.050"
    steps:
      - uses: actions/checkout@v4
      - name: Install patch and z3
        # patch: scripts/patch_one.py shells out to it, not bundled in the
        # verilator/verilator image. z3: same reason as unpatched-must-fail
        # -- without it, `randomize()` can't be solved the same way it was
        # verified locally, and every patch that relies on the solver fails
        # with "Subprocess command z3 --in failed: exit status 127".
        run: apt-get update && apt-get install -y patch z3
      - run: python3 scripts/check_patches_pass.py

  # Advisory only: unique_scalar_vs_slice needs a Verilator built from an
  # unmerged upstream patch (see manifest.toml's verilator_broken_as_of on
  # that entry). Not wired into the default triggers above -- run manually
  # via workflow_dispatch once there's a scripted way to build that patched
  # binary; until then this is a documented gap, not a silent one.
  patched-verilator-optional:
    name: unique_scalar_vs_slice against a patched Verilator (manual only)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "Not yet implemented: build Verilator from the upstream patch referenced"
          echo "in unique_scalar_vs_slice.sv's header, then run:"
          echo "  python3 scripts/patch_one.py unique_scalar_vs_slice --allow-unverifiable"
          echo "and verify it compiles and passes against that binary specifically."
          exit 1
